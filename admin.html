function t(key){
  return text[currentLanguage][key] || text.en[key] || key;
}

function changeLanguage(){

  currentLanguage =
    document.getElementById("language").value;

  document.getElementById("title").innerText=t("title");
  document.getElementById("subtitle").innerText=t("subtitle");
  document.getElementById("refreshBtn").innerText=t("refresh");
  document.getElementById("clearBtn").innerText=t("clear");
  document.getElementById("notice").innerText=t("notice");

  loadBookings();
}

function getBookings(){

  try{

    let data=localStorage.getItem("ganeshBookings");

    if(!data){
      return [];
    }

    let bookings=JSON.parse(data);

    if(Array.isArray(bookings)){
      return bookings;
    }

    return [];

  }catch(error){

    console.log(error);
    return [];

  }
}

function saveBookings(bookings){

  localStorage.setItem(
    "ganeshBookings",
    JSON.stringify(bookings)
  );

}

function value(obj, keys){

  for(let key of keys){

    if(
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){

      return obj[key];

    }

  }

  return "-";
}

function loadBookings(){

  const bookings=getBookings();

  const box=document.getElementById("allBookings");

  document.getElementById("bookingCount").innerText =
    t("bookings")+": "+bookings.length;

  if(bookings.length===0){

    box.innerHTML =
      '<div class="empty">📭 '+t("empty")+"</div>";

    return;
  }

  box.innerHTML="";

  bookings.forEach((booking,index)=>{

    let status=value(
      booking,
      ["status","bookingStatus"]
    );

    if(status==="-" || !status){
      status="pending";
    }

    let statusClass=
      status.toLowerCase();

    let customer=value(
      booking,
      ["name","customerName","fullName"]
    );

    let phone=value(
      booking,
      ["phone","mobile","mobileNumber","contact"]
    );

    let email=value(
      booking,
      ["email","emailAddress"]
    );

    let trip=value(
      booking,
      ["trip","package","packageName","destination","tour"]
    );

    let date=value(
      booking,
      ["date","travelDate","journeyDate","bookingDate"]
    );

    let time=value(
      booking,
      ["time","travelTime","journeyTime"]
    );

    let pickup=value(
      booking,
      ["pickup","pickupLocation","pickupPoint","location"]
    );

    let passengers=value(
      booking,
      ["passengers","persons","numberOfPassengers","people"]
    );

    let amount=value(
      booking,
      ["amount","totalAmount","price","total"]
    );

    let advance=value(
      booking,
      ["advance","advancePayment","advanceAmount"]
    );

    let html=`

      <div class="booking ${statusClass}">

        <h3>📋 ${trip}</h3>

        <div class="row">
          <span class="label">${t("customer")}:</span>
          ${customer}
        </div>

        <div class="row">
          <span class="label">${t("phone")}:</span>
          ${phone}
        </div>

        <div class="row">
          <span class="label">${t("email")}:</span>
          ${email}
        </div>

        <div class="row">
          <span class="label">${t("date")}:</span>
          📅 ${date}
        </div>

        <div class="row">
          <span class="label">${t("time")}:</span>
          🕐 ${time}
        </div>

        <div class="row">
          <span class="label">${t("pickup")}:</span>
          ${pickup}
        </div>

        <div class="row">
          <span class="label">${t("passengers")}:</span>
          ${passengers}
        </div>

        <div class="row">
          <span class="label">${t("amount")}:</span>
          ₹${amount}
        </div>

        <div class="row">
          <span class="label">${t("advance")}:</span>
          ₹${advance}
        </div>

        <div class="row">
          <span class="label">${t("status")}:</span>
          <span class="status ${statusClass}">
            ${statusText(status)}
          </span>
        </div>

        <div class="actions">

          <button
            class="success"
            onclick="confirmBooking(${index})">
            ${t("confirm")}
          </button>

          <button
            onclick="cancelBooking(${index})">
            ${t("cancel")}
          </button>

          <button
            class="danger"
            onclick="deleteBooking(${index})">
            ${t("delete")}
          </button>

        </div>

      </div>

    `;

    box.innerHTML+=html;

  });

}

function statusText(status){

  if(status==="confirmed"){
    return t("confirmed");
  }

  if(status==="cancelled"){
    return t("cancelled");
  }

  return t("pending");

}

function confirmBooking(index){

  if(!confirm(t("confirmAsk"))){
    return;
  }

  let bookings=getBookings();

  if(!bookings[index]){
    return;
  }

  bookings[index].status="confirmed";

  bookings[index].confirmedAt =
    new Date().toLocaleString();

  saveBookings(bookings);

  alert(t("yesConfirm"));

  loadBookings();

}

function cancelBooking(index){

  if(!confirm(t("confirmAsk"))){
    return;
  }

  let bookings=getBookings();

  if(!bookings[index]){
    return;
  }

  bookings[index].status="cancelled";

  saveBookings(bookings);

  alert(t("yesCancel"));

  loadBookings();

}

function deleteBooking(index){

  if(!confirm(t("deleteAsk"))){
    return;
  }

  let bookings=getBookings();

  bookings.splice(index,1);

  saveBookings(bookings);

  loadBookings();

}

function clearBookings(){

  if(!confirm(t("clearAsk"))){
    return;
  }

  localStorage.removeItem("ganeshBookings");

  document.getElementById("allBookings").innerHTML =
    '<div class="empty">✅ '+t("deleted")+"</div>";

  document.getElementById("bookingCount").innerText =
    t("bookings")+": 0";

  alert(t("deleted"));

}

loadBookings();

</script>
