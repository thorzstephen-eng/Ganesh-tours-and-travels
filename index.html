<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ganesh Tours & Travels</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033;
}
header{
 background:#0b3d91;
 color:white;
 padding:25px 15px;
 text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}

.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}

.card{
 background:white;
 margin:15px 0;
 padding:20px;
 border-radius:15px;
 box-shadow:0 4px 15px #0002;
}

h2{color:#0b3d91}

label{
 display:block;
 margin-top:12px;
 font-weight:bold;
}

input,select{
 width:100%;
 padding:13px;
 margin-top:6px;
 border:1px solid #bbb;
 border-radius:8px;
 font-size:16px;
}

button{
 width:100%;
 padding:14px;
 margin-top:18px;
 border:0;
 border-radius:9px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.bookBtn{background:#0b3d91;color:white}
.payBtn{background:#168a36;color:white}
.whatsapp{background:#25d366;color:white}

.tour{
 display:inline-block;
 background:#eef4ff;
 color:#0b3d91;
 padding:10px;
 margin:5px;
 border-radius:8px;
 font-weight:bold;
}

.success{
 display:none;
 background:#e8fff0;
 border:2px solid #168a36;
 padding:18px;
 border-radius:12px;
 margin-top:20px;
}

.admin{
 display:none;
}

.booking{
 border:1px solid #ddd;
 padding:15px;
 margin:12px 0;
 border-radius:10px;
 background:#fafafa;
}

.small{
 font-size:13px;
 color:#666;
}

footer{
 text-align:center;
 padding:25px;
 color:#666;
}
</style>
</head>

<body>

<header>
<h1>Ganesh Tours & Travels</h1>
<p>Arnala, Virar West - 401302</p>
<p>Online Tour Booking</p>
</header>

<div class="container">

<div class="card">
<h2>Our Tours</h2>

<span class="tour">Round Trip</span>
<span class="tour">One Way Trip</span>
<span class="tour">Ashtvinayak</span>
<span class="tour">Kokan</span>
<span class="tour">Mahabaleshwar</span>
</div>

<div class="card">

<h2>Book Your Tour</h2>

<label>Customer Name</label>
<input id="name" type="text" placeholder="Enter your name">

<label>Mobile Number</label>
<input id="mobile" type="tel" placeholder="Enter mobile number">

<label>Tour</label>
<select id="tour">
<option value="">Select Tour</option>
<option>Round Trip</option>
<option>One Way Trip</option>
<option>Ashtvinayak</option>
<option>Kokan</option>
<option>Mahabaleshwar</option>
</select>

<label>Travel Date</label>
<input id="date" type="date">

<label>Number of Passengers</label>
<input id="persons" type="number" min="1" value="1">

<label>Total Cost (₹)</label>
<input id="total" type="number" placeholder="Enter total cost">

<button class="bookBtn" onclick="bookTour()">Confirm Booking</button>

<div id="success" class="success">
<h3>✅ Booking Submitted</h3>
<div id="bookingDetails"></div>

<button class="payBtn" onclick="payAdvance()">
Pay Advance ₹500
</button>

<button class="whatsapp" onclick="sendWhatsApp()">
Send Booking on WhatsApp
</button>
</div>

</div>

<div class="card">
<h2>Admin</h2>

<p>Admin panel उघडण्यासाठी password टाका.</p>

<input id="adminPassword" type="password" placeholder="Admin Password">

<button class="bookBtn" onclick="openAdmin()">
Open Admin Panel
</button>

<div id="adminPanel" class="admin">

<h2>📋 All Bookings</h2>

<div id="allBookings"></div>

<button onclick="clearBookings()" style="background:#d62828;color:white">
Delete All Bookings
</button>

</div>
</div>

</div>

<footer>
Ganesh Tours & Travels © 2026
</footer>

<script>

let currentBooking=null;

/* CHANGE THIS PASSWORD */
const ADMIN_PASSWORD="1234";

function bookTour(){

 const name=document.getElementById("name").value.trim();
 const mobile=document.getElementById("mobile").value.trim();
 const tour=document.getElementById("tour").value;
 const date=document.getElementById("date").value;
 const persons=document.getElementById("persons").value;
 const total=document.getElementById("total").value;

 if(!name || !mobile || !tour || !date || !persons || !total){
   alert("Please fill all booking details.");
   return;
 }

 currentBooking={
   id:Date.now(),
   name:name,
   mobile:mobile,
   tour:tour,
   date:date,
   persons:persons,
   total:total,
   advance:500,
   time:new Date().toLocaleString()
 };

 let bookings=JSON.parse(localStorage.getItem("ganeshBookings")||"[]");

 bookings.push(currentBooking);

 localStorage.setItem("ganeshBookings",JSON.stringify(bookings));

 document.getElementById("bookingDetails").innerHTML=
 `
 <b>Name:</b> ${name}<br>
 <b>Mobile:</b> ${mobile}<br>
 <b>Tour:</b> ${tour}<br>
 <b>Date:</b> ${date}<br>
 <b>Passengers:</b> ${persons}<br>
 <b>Total Cost:</b> ₹${total}<br>
 <b>Advance:</b> ₹500
 `;

 document.getElementById("success").style.display="block";

 window.scrollTo({
   top:document.getElementById("success").offsetTop,
   behavior:"smooth"
 });
}

function payAdvance(){

 /*
  IMPORTANT:
  Replace YOUR-UPI-ID@upi with your actual UPI ID.
 */

 const upi="YOUR-UPI-ID@upi";

 const url=
 "upi://pay?pa="+encodeURIComponent(upi)+
 "&pn="+encodeURIComponent("Ganesh Tours & Travels")+
 "&am=500"+
 "&cu=INR";

 window.location.href=url;
}

function sendWhatsApp(){

 if(!currentBooking) return;

 const message=
 `Ganesh Tours & Travels Booking

Name: ${currentBooking.name}
Mobile: ${currentBooking.mobile}
Tour: ${currentBooking.tour}
Date: ${currentBooking.date}
Passengers: ${currentBooking.persons}
Total Cost: ₹${currentBooking.total}
Advance: ₹500`;

 const whatsapp=
 "https://wa.me/?text="+encodeURIComponent(message);

 window.open(whatsapp,"_blank");
}

function openAdmin(){

 const password=document.getElementById("adminPassword").value;

 if(password!==ADMIN_PASSWORD){
   alert("Wrong admin password.");
   return;
 }

 document.getElementById("adminPanel").style.display="block";

 loadBookings();

 window.scrollTo({
   top:document.getElementById("adminPanel").offsetTop,
   behavior:"smooth"
 });
}

function loadBookings(){

 const bookings=
 JSON.parse(localStorage.getItem("ganeshBookings")||"[]");

 const box=document.getElementById("allBookings");

 if(bookings.length===0){
   box.innerHTML="<p>No bookings yet.</p>";
   return;
 }

 box.innerHTML="";

 bookings.reverse().forEach((b,index)=>{

   box.innerHTML+=
   `
   <div class="booking">

   <h3>Booking #${bookings.length-index}</h3>

   <b>Name:</b> ${b.name}<br>
   <b>Mobile:</b> ${b.mobile}<br>
   <b>Tour:</b> ${b.tour}<br>
   <b>Date:</b> ${b.date}<br>
   <b>Passengers:</b> ${b.persons}<br>
   <b>Total:</b> ₹${b.total}<br>
   <b>Advance:</b> ₹${b.advance}<br>

   <div class="small">
   Booked: ${b.time}
   </div>

   </div>
   `;
 });
}

function clearBookings(){

 if(confirm("Delete all bookings?")){
   localStorage.removeItem("ganeshBookings");
   loadBookings();
 }
}

</script>

</body>
</html>
